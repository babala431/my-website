<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        h1 { margin-bottom: 20px; color: #58a6ff; font-size: 24px; }
        
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        .drop-zone { border: 2px dashed #484f58; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: 0.2s; background: #0d1117; }
        .drop-zone:hover { border-color: #58a6ff; background: #161b22; }
        .drop-zone p { color: #8b949e; font-size: 14px; }
        #file-input { display: none; }

        .controls { display: flex; flex-direction: column; gap: 12px; background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #21262d; }
        .control-group { display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 14px; font-weight: 600; color: #c9d1d9; }
        input[type="range"] { width: 55%; accent-color: #238636; cursor: pointer; }
        .val-badge { background: #21262d; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #58a6ff; font-weight: bold; }

        .preview-area { display: flex; justify-content: center; align-items: center; background: #010409; border-radius: 8px; padding: 10px; min-height: 250px; overflow: auto; max-height: 600px; }
        canvas { image-rendering: pixelated; border-radius: 4px; display: none; }

        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

        /* Sosyal Medya Tasarımı */
        .socials { display: flex; justify-content: center; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
        .social-item { display: flex; align-items: center; gap: 8px; background: #0d1117; border: 1px solid #30363d; padding: 8px 14px; border-radius: 20px; text-decoration: none; color: #c9d1d9; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .social-item:hover { border-color: #58a6ff; color: #58a6ff; transform: translateY(-2px); }
        .social-item svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

    <h1>🎨 Pixel Art Dönüştürücü</h1>

    <div class="container">
        <div class="drop-zone" id="drop-zone">
            <p>Fotoğrafı buraya sürükleyin veya <strong>dosya seçmek için tıklayın</strong></p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="pixel-size">Piksel Detayı:</label>
                <input type="range" id="pixel-size" min="16" max="1024" value="128" step="16">
                <span class="val-badge" id="size-val">128px</span>
            </div>
            
            <div class="control-group">
                <label for="display-scale">Resim Ekran Boyutu:</label>
                <input type="range" id="display-scale" min="20" max="200" value="100" step="5">
                <span class="val-badge" id="scale-val">100%</span>
            </div>
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="btn-group">
            <button id="download-btn" disabled>İndir (PNG)</button>
        </div>

        <!-- Sosyal Medya Bölümü -->
        <div class="socials">
            <a href="https://instagram.com/enverpasababaq9" target="_blank" class="social-item">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span>insta: enverpasababaq9</span>
            </a>
            
            <div class="social-item">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                <span>discord: darkvesn</span>
            </div>
        </div>
    </div>

    <script>
        const PALETTE = [
            "#FFFFFF", "#593D29", "#E3E4E5", "#F7E1B5", "#CCCCCC", "#FFFF80",
            "#7F7F7F", "#E5D900", "#4C4C4C", "#8CE63A", "#000000", "#00CD00",
            "#FFA0A0", "#5C7835", "#FF80C0", "#006B1F", "#FF3399", "#CCE5FF",
            "#FF5555", "#00CCE5", "#FF0000", "#0080D0", "#800000", "#0000FF",
            "#FF9955", "#101B7A", "#E59000", "#CD78EA", "#9A643E", "#800080"
        ].map(hex => {
            const num = parseInt(hex.slice(1), 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        });

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const sizeInput = document.getElementById('pixel-size');
        const sizeVal = document.getElementById('size-val');
        const scaleInput = document.getElementById('display-scale');
        const scaleVal = document.getElementById('scale-val');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');

        let loadedImg = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleImage(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#58a6ff'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#484f58'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#484f58';
            if (e.dataTransfer.files.length) handleImage(e.dataTransfer.files[0]);
        });

        sizeInput.addEventListener('input', (e) => {
            sizeVal.textContent = `${e.target.value}px`;
            if (loadedImg) renderPixelArt();
        });

        scaleInput.addEventListener('input', (e) => {
            const scale = e.target.value;
            scaleVal.textContent = `${scale}%`;
            canvas.style.width = `${scale}%`;
        });

        function handleImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                loadedImg = new Image();
                loadedImg.onload = () => {
                    canvas.style.display = 'block';
                    downloadBtn.disabled = false;
                    renderPixelArt();
                };
                loadedImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function getClosestColor(r, g, b) {
            let minDistance = Infinity;
            let closest = PALETTE[0];
            for (let i = 0; i < PALETTE.length; i++) {
                const p = PALETTE[i];
                const dist = Math.pow(r - p[0], 2) + Math.pow(g - p[1], 2) + Math.pow(b - p[2], 2);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = p;
                }
            }
            return closest;
        }

        function renderPixelArt() {
            const targetSize = parseInt(sizeInput.value);
            const aspectRatio = loadedImg.height / loadedImg.width;
            
            let w = targetSize;
            let h = Math.round(targetSize * aspectRatio);

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = w;
            tempCanvas.height = h;

            tempCtx.drawImage(loadedImg, 0, 0, w, h);
            const imgData = tempCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] < 128) continue;
                const [r, g, b] = getClosestColor(data[i], data[i + 1], data[i + 2]);
                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
            }

            tempCtx.putImageData(imgData, 0, 0);

            canvas.width = loadedImg.width;
            canvas.height = loadedImg.height;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(tempCanvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
