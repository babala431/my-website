<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sitem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #38bdf8;
            object-fit: cover;
        }

        h1 {
            font-size: 1.6rem;
            color: #f8fafc;
            margin-bottom: 5px;
        }

        p.title {
            color: #38bdf8;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p.bio {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #475569;
        }

        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="profile-img" src="https://via.placeholder.com/150" alt="Profil">
        <h1>Merhaba, Ben Babala! 👋</h1>
        <p class="title">Web Geliştirici & Tasarımcı</p>
        <p class="bio">Kendi web siteme hoş geldiniz! Burada projelerimi ve öğrendiğim yeni teknolojileri paylaşıyorum.</p>

        <div class="links">
            <a href="https://github.com/babala431" class="btn" target="_blank">GitHub Profilim</a>
            <a href="#" class="btn">Instagram</a>
            <a href="#" class="btn">İletişime Geç</a>
        </div>
    </div>

</body>
</html>
